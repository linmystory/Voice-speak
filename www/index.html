<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Cho phép phóng to (không khoá maximum-scale/user-scalable): người dùng thị lực kém / TalkBack
     cần phóng to được; khoá zoom là lỗi trợ năng phổ biến (Lighthouse/WCAG 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đọc Văn Bản - Text to Speech</title>
<style>
  :root {
    --bg-main: #0a0e17;
    --bg-card: #131826;
    --bg-input: #1a2133;
    --accent: #00e5ff;
    --accent-dim: #0097a7;
    --accent-glow: rgba(0, 229, 255, 0.25);
    --text-main: #e6f1ff;
    --text-dim: #7d8aa3;
    --danger: #ff4d6d;
    --danger-dim: #b0233c;
    --success: #00e676;
    --border: #232c42;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Màn hình lớn hơn (tablet Android) vẫn giữ layout gọn, không bị kéo giãn quá rộng */
  @media (min-width: 900px) {
    .app { max-width: 720px; }
  }

  html, body {
    height: 100%;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    /* Capacitor 8 nhắm SDK 36 nên Android 15+ hiển thị tràn viền (edge-to-edge). WebView < 140
       trả SAI giá trị env(safe-area-inset-*) -> thanh trên (nút Cài đặt/Lưu) có thể nằm dưới
       thanh trạng thái, nội dung cuối nằm dưới thanh điều hướng. Plugin SystemBars của
       Capacitor bơm biến --safe-area-inset-* đúng; dùng nó làm giá trị ưu tiên, env() dự phòng
       (đúng mẫu trong tài liệu chính thức của Capacitor). */
    padding:
      var(--safe-area-inset-top, env(safe-area-inset-top, 0px))
      calc(14px + var(--safe-area-inset-right, env(safe-area-inset-right, 0px)))
      calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))
      calc(14px + var(--safe-area-inset-left, env(safe-area-inset-left, 0px)));
    background:
      radial-gradient(circle at 20% 0%, rgba(0,229,255,0.08), transparent 40%),
      radial-gradient(circle at 100% 30%, rgba(0,229,255,0.05), transparent 50%),
      var(--bg-main);
    min-height: 100%;
  }

  .app { max-width: 640px; margin: 0 auto; padding-bottom: 12px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  textarea {
    width: 100%;
    min-height: 180px;
    max-height: 320px;
    resize: vertical;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-main);
    font-size: 15px;
    line-height: 1.5;
    padding: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  textarea::placeholder { color: var(--text-dim); }

  .textarea-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  #charCount.limit-near { color: #ffb300; }
  #charCount.limit-max { color: var(--danger); }

  .btn-clear-small {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-clear-small:active { background: var(--bg-input); }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 36px;
  }
  select:focus { border-color: var(--accent); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 18px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + 20px);
    transform: translateX(-50%) translateY(20px);
    z-index: 200;
    background: #1e2740;
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { border-color: var(--danger); }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; padding: 10px 0 4px; }

  /* ---------- Thanh trên cùng: Cài đặt (trái) — Tiêu đề (giữa) — Lưu âm thanh (phải) ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0 16px;
  }
  .topbar-title {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--accent), #7c4dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }
  .icon-btn:active { transform: scale(0.94); }
  .btn-save-top {
    flex-shrink: 0;
    height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: 0.15s;
  }
  .btn-save-top:active { transform: scale(0.96); }
  .btn-save-top:disabled { opacity: 0.4; }
  .btn-save-top.processing { color: var(--accent); border-color: var(--accent); opacity: 0.85; }

  /* ---------- Menu Cài đặt: gom Bộ đọc / Giọng đọc / Tốc độ / Cao độ ---------- */
  .settings-wrap { position: relative; }
  .settings-panel {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: min(320px, 86vw);
    max-height: 72vh;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    z-index: 60;
  }
  .settings-panel.open { display: block; }
  .settings-panel-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .settings-panel .field:last-child { margin-bottom: 0; }

  /* ---------- Trình phát: 1 nút Phát/Dừng duy nhất, căn giữa ---------- */
  .player-row {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }
  .btn-play {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #001018;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--accent-glow);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-play:active { transform: scale(0.96); }
  .btn-play.speaking {
    background: linear-gradient(135deg, #ffb300, #ff7300);
    box-shadow: 0 8px 24px rgba(255,140,0,0.3);
  }
  .btn-play:disabled { opacity: 0.5; }
  .player-label {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* ------------------------------------------------------------------
     Co giãn cho màn hình rất nhỏ (~320-360px, một số máy Android giá rẻ).
     QUAN TRỌNG: khối này phải nằm SAU mọi rule gốc ở trên trong file CSS.
     Lý do: các rule bên dưới và rule gốc bên trên có CÙNG độ ưu tiên
     (specificity) — nếu đặt @media này lên TRƯỚC các rule gốc, quy tắc
     "rule đứng sau thắng khi specificity bằng nhau" sẽ khiến rule gốc
     (đứng sau) âm thầm GHI ĐÈ mất phần co giãn responsive này, làm màn
     hình nhỏ không co giãn dù code trông có vẻ đúng (đây là lỗi CSS thật
     đã phát hiện và sửa trong lần rà soát này).
     ------------------------------------------------------------------ */
  @media (max-width: 360px) {
    .topbar-title { font-size: 15px; }
    .card { padding: 12px; }
    textarea { min-height: 150px; font-size: 14px; }
    .btn-play { width: 72px; height: 72px; font-size: 26px; }
    .btn-save-top { padding: 0 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="settings-wrap">
      <button class="icon-btn" id="btnSettings" title="Cài đặt" aria-label="Mở cài đặt giọng đọc" aria-haspopup="true" aria-expanded="false">⚙️</button>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-panel-title">🎛️ Cài đặt giọng đọc</div>
        <div class="field">
          <label for="engineSelect">Danh sách bộ đọc</label>
          <select id="engineSelect"></select>
        </div>
        <div class="field">
          <label for="voiceSelect">Danh sách giọng đọc</label>
          <select id="voiceSelect"></select>
        </div>
        <div class="field">
          <label for="rateSelect">Tốc độ đọc</label>
          <select id="rateSelect">
            <option value="0.5">0.5x - Rất chậm</option>
            <option value="0.75">0.75x - Chậm</option>
            <option value="1.0" selected>1.0x - Bình thường</option>
            <option value="1.25">1.25x - Nhanh</option>
            <option value="1.5">1.5x - Khá nhanh</option>
            <option value="2.0">2.0x - Rất nhanh</option>
          </select>
        </div>
        <div class="field">
          <label for="pitchSelect">Cao độ giọng nói</label>
          <select id="pitchSelect">
            <option value="0.5">0.5 - Trầm nhất</option>
            <option value="0.75">0.75 - Trầm</option>
            <option value="1.0" selected>1.0 - Bình thường</option>
            <option value="1.25">1.25 - Cao</option>
            <option value="1.5">1.5 - Khá cao</option>
            <option value="1.75">1.75 - Cao hơn</option>
            <option value="2.0">2.0 - Cao nhất</option>
          </select>
        </div>
      </div>
    </div>

    <div class="topbar-title">🔊 ĐỌC VĂN BẢN</div>

    <button class="btn-save-top" id="btnSaveAudio">💾 Lưu âm thanh</button>
  </div>

  <div class="card">
    <div class="card-title">📝 Văn bản cần đọc</div>
    <textarea id="textInput" maxlength="25000" aria-label="Văn bản cần đọc" placeholder="Nhập hoặc dán văn bản vào đây (tối đa 25.000 ký tự)..."></textarea>
    <div class="textarea-footer">
      <span id="charCount">0 / 25.000</span>
      <button class="btn-clear-small" id="btnClearText">🗑 Xóa nhanh</button>
    </div>
  </div>

  <div class="card">
    <div class="player-row">
      <button class="btn-play" id="btnSpeak" title="Phát / Dừng" aria-label="Phát văn bản">
        <span id="btnSpeakIcon" aria-hidden="true">▶️</span>
      </button>
    </div>
    <div class="player-label" id="btnSpeakLabel">ĐỌC VĂN BẢN</div>

    <div class="status-bar" role="status" aria-live="polite">
      <span class="dot" id="statusDot" aria-hidden="true"></span>
      <span id="statusText">Sẵn sàng</span>
    </div>
  </div>

  <footer>Ứng dụng chạy hoàn toàn ngoại tuyến trên thiết bị của bạn</footer>
</div>

<!-- role/aria-live: để TalkBack tự đọc thông báo (đặc biệt thông báo lỗi); bản cũ im lặng hoàn toàn. -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  // ---------- Lưới an toàn toàn cục ----------
  // Bắt mọi lỗi JS không lường trước (kể cả lỗi trong promise bị bỏ quên
  // .catch) để hiển thị toast thay vì để WebView hiển thị màn hình trắng
  // hoặc coi như ứng dụng bị treo. Không dùng preventDefault() cho lỗi cú
  // pháp nghiêm trọng (sẽ không tới được đây vì file sẽ không parse được),
  // chỉ áp dụng cho lỗi runtime xảy ra sau khi app đã chạy.
  window.addEventListener('error', function (event) {
    try {
      console.error('Lỗi runtime không mong muốn:', event.error || event.message);
      if (typeof showToast === 'function') {
        showToast('Đã xảy ra lỗi, vui lòng thử lại: ' + (event.message || 'không rõ nguyên nhân'), true);
      }
    } catch (_) { /* không để lỗi trong chính trình xử lý lỗi làm hỏng thêm gì */ }
  });
  window.addEventListener('unhandledrejection', function (event) {
    try {
      const reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'không rõ nguyên nhân';
      console.error('Promise bị từ chối không được xử lý:', reason);
      if (typeof showToast === 'function') {
        showToast('Đã xảy ra lỗi: ' + reason, true);
      }
    } catch (_) { /* bỏ qua */ }
  });

  const textInput = document.getElementById('textInput');
  const charCount = document.getElementById('charCount');
  const btnClearText = document.getElementById('btnClearText');
  const engineSelect = document.getElementById('engineSelect');
  const voiceSelect = document.getElementById('voiceSelect');
  const rateSelect = document.getElementById('rateSelect');
  const pitchSelect = document.getElementById('pitchSelect');
  const btnSpeak = document.getElementById('btnSpeak');
  const btnSpeakIcon = document.getElementById('btnSpeakIcon');
  const btnSpeakLabel = document.getElementById('btnSpeakLabel');
  const btnSaveAudio = document.getElementById('btnSaveAudio');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const toast = document.getElementById('toast');

  // Menu Cài đặt (⚙️, góc trên-trái): gom Danh sách bộ đọc / giọng đọc /
  // Tốc độ đọc / Cao độ giọng nói vào 1 panel duy nhất, ẩn cho tới khi bấm.
  const btnSettings = document.getElementById('btnSettings');
  const settingsPanel = document.getElementById('settingsPanel');

  const MAX_CHARS = 25000;
  const CHUNK_MAX_LEN = 180;       // độ dài tối đa mỗi đoạn gửi cho TTS (an toàn cho engine Android)
  const KEEPALIVE_MS = 4000;       // chu kỳ "đánh thức" chống bug Android tự treo sau ~15s

  let voicesByEngine = {};   // { engineKey: [voice, voice, ...] }
  let nativeEngineLabels = {}; // { engineKey(package name): label hiển thị } — chỉ dùng khi ttsMode === 'native'
  let allVoices = [];
  let isSpeaking = false;    // đang thực sự phát âm thanh (nút chính đang ở trạng thái ⏹ Dừng)
  let toastTimer = null;
  let keepAliveTimer = null;

  let speechQueue = [];      // mảng các câu/đoạn cần đọc
  let queueIndex = 0;        // đoạn đang đọc / sẽ đọc tiếp
  let lastQueueText = '';    // văn bản đã dùng để xây speechQueue lần gần nhất
  let currentSessionId = 0;  // để phân biệt phiên đọc cũ khi cancel

  // Cờ chống "chạm đúp": khoảng thời gian từ lúc bấm Phát/Lưu tới lúc giao diện đổi
  // sang trạng thái đang chạy có các bước await (hỏi trạng thái engine...). Nếu không
  // chặn, chạm 2 lần liên tiếp gửi 2 lệnh -> đọc trùng hai lần / xuất file hai lần.
  let startInFlight = false;
  let lastSpeedToastKey = ''; // chỉ báo "tốc độ phần mềm" 1 lần cho mỗi mức bù khác nhau
  let saveInFlight = false;
  const SAVE_LABEL = '💾 Lưu âm thanh';

  const synthSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  // 'web' = dùng Web Speech API của WebView, 'native' = dùng plugin Kotlin (TextToSpeech gốc Android),
  // 'none' = không có cách nào đọc được trên máy này
  let ttsMode = 'web';

  // ---------- Toast ----------
  function showToast(msg, isError) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ---------- Char counter ----------
  function updateCharCount() {
    const len = textInput.value.length;
    charCount.textContent = len.toLocaleString('vi-VN') + ' / 25.000';
    charCount.classList.remove('limit-near', 'limit-max');
    if (len >= MAX_CHARS) {
      charCount.classList.add('limit-max');
    } else if (len >= MAX_CHARS * 0.9) {
      charCount.classList.add('limit-near');
    }
  }

  // ---------- BUG: xoá văn bản trong lúc đang đọc nhưng app vẫn tiếp tục đọc ----------
  // Nguyên nhân: trước đây không có nơi nào theo dõi nội dung ô nhập trong lúc
  // đang phát — chỉ có nút Dừng mới ngắt đọc. Từ giờ: bất cứ khi nào ô nhập
  // TRỞ NÊN RỖNG (xoá hết chữ hoặc bấm "Xoá nhanh") trong lúc đang đọc, tự
  // động dừng ngay, không đợi người dùng bấm nút Dừng — vì tiếp tục đọc nội
  // dung đã biến mất khỏi màn hình rất khó hiểu, đặc biệt với người dùng
  // TalkBack (không nhìn thấy ô nhập còn chữ hay không).
  async function stopIfTextClearedWhileSpeaking() {
    if (!isSpeaking) return;
    if (textInput.value.trim() !== '') return;
    await stopCurrentSpeech();
    resetQueueState();
    setSpeakingUI(false);
    statusText.textContent = 'Đã dừng do văn bản bị xoá';
  }

  textInput.addEventListener('input', () => {
    updateCharCount();
    stopIfTextClearedWhileSpeaking();
  });

  btnClearText.addEventListener('click', () => {
    textInput.value = '';
    updateCharCount();
    textInput.focus();
    // Gán .value bằng JS KHÔNG tự bắn sự kiện 'input' của trình duyệt (chỉ
    // gõ/dán tay mới bắn) -> phải gọi tường minh ở đây, nếu không bấm nút
    // này trong lúc đang đọc sẽ không dừng được (đúng lỗi đã gặp phải).
    stopIfTextClearedWhileSpeaking();
  });

  // ---------- Menu Cài đặt (⚙️): gom Danh sách bộ đọc / giọng đọc / Tốc độ / Cao độ ----------
  // 4 tùy chọn này không hiện thường trực trên màn hình chính nữa — chỉ mở
  // ra khi người dùng bấm vào biểu tượng Cài đặt (góc trên-trái), giúp màn
  // hình chính gọn gàng hơn. Các phần tử select (engineSelect, voiceSelect,
  // rateSelect, pitchSelect) vẫn y hệt trước đây (cùng ID, cùng listener)
  // nên toàn bộ logic chọn bộ đọc/giọng đọc/tốc độ/cao độ ở phía dưới
  // KHÔNG cần đổi gì, chỉ đổi chỗ hiển thị.
  function closeSettingsPanel() {
    settingsPanel.classList.remove('open');
    btnSettings.setAttribute('aria-expanded', 'false');
  }
  function openSettingsPanel() {
    settingsPanel.classList.add('open');
    btnSettings.setAttribute('aria-expanded', 'true');
  }
  btnSettings.addEventListener('click', (e) => {
    e.stopPropagation();
    if (settingsPanel.classList.contains('open')) {
      closeSettingsPanel();
    } else {
      openSettingsPanel();
    }
  });
  // Bấm ra ngoài panel thì tự đóng lại. Không đóng khi bấm chính vào panel
  // (ví dụ đang thao tác trên select) hoặc vào icon Cài đặt (đã tự xử lý
  // đóng/mở riêng ở trên).
  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== btnSettings) {
      closeSettingsPanel();
    }
  });
  // Bấm vào bên trong panel không được để sự kiện "nổi bọt" lên document
  // (nếu không, listener bên trên sẽ hiểu nhầm là "bấm ra ngoài" và đóng
  // panel ngay khi người dùng vừa mở select bên trong).
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());

  // ---------- Engine name guess ----------
  // Web Speech API không luôn cung cấp "engine name" rõ ràng.
  // Ta nhóm giọng nói theo voice.name prefix / voiceURI domain / hoặc theo nhà cung cấp suy luận.
  function guessEngineName(voice) {
    const name = voice.name || '';
    const uri = voice.voiceURI || '';
    // Các mẫu phổ biến trên Android: "Google 한국어", "Samsung TTS", "Microsoft ...", v.v.
    if (/google/i.test(name) || /google/i.test(uri)) return 'Google TTS';
    if (/samsung/i.test(name) || /samsung/i.test(uri)) return 'Samsung TTS';
    if (/microsoft/i.test(name) || /microsoft/i.test(uri)) return 'Microsoft TTS';
    if (/amazon|polly/i.test(name)) return 'Amazon TTS';
    if (/apple|siri/i.test(name)) return 'Apple TTS';
    // Nếu voiceURI có dạng "com.xxx.yyy", lấy phần domain giữa làm tên bộ đọc
    const match = uri.match(/^([a-zA-Z0-9]+(\.[a-zA-Z0-9]+){1,2})/);
    if (match) return match[1];
    return 'Bộ đọc hệ thống';
  }

  function isVietnameseVoice(voice) {
    return /^vi(-|_|$)/i.test(voice.lang) || /viet/i.test(voice.name);
  }

  // ---------- Tách văn bản dài thành các đoạn nhỏ để đọc nối tiếp (queue) ----------
  // Nhiều engine TTS trên Android sẽ cắt/bỏ qua văn bản nếu 1 utterance quá dài.
  // Ta tách theo câu (dấu . ! ? … và xuống dòng), rồi gộp các câu ngắn lại
  // cho tới khi gần chạm CHUNK_MAX_LEN, để giọng đọc không bị ngắt quá vụn.
  function splitIntoChunks(text) {
    const normalized = text.replace(/\r\n/g, '\n').trim();
    if (!normalized) return [];

    // Tách theo câu, giữ lại dấu câu.
    // LƯU Ý: cố tình KHÔNG dùng lookbehind (?<=...) ở đây. Một số WebView Android
    // cũ (đặc biệt trên máy không có Google Play Services / chưa cập nhật) không
    // hỗ trợ lookbehind và sẽ ném SyntaxError ngay khi nạp <script>, làm sập toàn
    // bộ ứng dụng chứ không riêng gì tính năng tách câu. Cách dưới đây tương đương
    // về mặt kết quả nhưng dùng regex tương thích ngược.
    const rawSentences = [];
    normalized.split(/\n+/).forEach(line => {
      const trimmedLine = line.trim();
      if (!trimmedLine) return;
      // LỖI ĐÃ SỬA: bản cũ /[^.!?…]+[.!?…]*/g cắt câu tại MỌI dấu chấm, kể cả dấu
      // chấm nằm giữa số hoặc từ viết tắt ("1.000.000", "3.14", "10.30", "TP.HCM"),
      // rồi nối các mảnh lại bằng dấu cách -> engine đọc "1. 000. 000" thành
      // "một, không không không, không không không" thay vì "một triệu". Nay chỉ coi
      // .!?… là ranh giới câu khi ĐỨNG SAU LÀ khoảng trắng hoặc hết dòng (giống
      // regex phía Kotlin). Chỉ dùng lookahead (?!...), KHÔNG dùng lookbehind, để
      // vẫn tương thích WebView Android cũ.
      const matches = trimmedLine.match(/(?:[^.!?…]|[.!?…](?!\s|$))+[.!?…]*/g);
      if (matches) {
        matches.forEach(m => {
          const t = m.trim();
          if (t) rawSentences.push(t);
        });
      }
    });

    const chunks = [];
    let buffer = '';

    rawSentences.forEach(sentence => {
      // Nếu bản thân 1 câu đã quá dài, cắt cứng theo CHUNK_MAX_LEN tại khoảng trắng gần nhất
      if (sentence.length > CHUNK_MAX_LEN) {
        if (buffer) { chunks.push(buffer); buffer = ''; }
        let remaining = sentence;
        while (remaining.length > CHUNK_MAX_LEN) {
          let cut = remaining.lastIndexOf(' ', CHUNK_MAX_LEN);
          if (cut <= 0) cut = CHUNK_MAX_LEN;
          chunks.push(remaining.slice(0, cut).trim());
          remaining = remaining.slice(cut).trim();
        }
        if (remaining) buffer = remaining;
        return;
      }

      if ((buffer + ' ' + sentence).trim().length > CHUNK_MAX_LEN) {
        if (buffer) chunks.push(buffer);
        buffer = sentence;
      } else {
        buffer = (buffer ? buffer + ' ' : '') + sentence;
      }
    });

    if (buffer) chunks.push(buffer);
    return chunks;
  }

  // ---------- Load voices ----------
  function loadVoices() {
    // Khi đã chuyển sang bộ đọc native, danh sách bộ đọc/giọng do plugin cung cấp mới
    // là nguồn đúng. Sự kiện voiceschanged của Web Speech đến muộn KHÔNG được ghi đè
    // danh sách đó: nếu ghi đè, tên engine kiểu web ("Google TTS"...) sẽ bị gửi sang
    // plugin.setEngine() và báo lỗi "không thể chuyển sang bộ đọc đã chọn".
    if (ttsMode === 'native') return true;
    allVoices = window.speechSynthesis.getVoices() || [];
    if (allVoices.length === 0) return false;

    voicesByEngine = {};
    allVoices.forEach(v => {
      const engine = guessEngineName(v);
      if (!voicesByEngine[engine]) voicesByEngine[engine] = [];
      voicesByEngine[engine].push(v);
    });

    // Sắp xếp: bộ đọc có giọng tiếng Việt lên trước
    const engineNames = Object.keys(voicesByEngine).sort((a, b) => {
      const aHasVi = voicesByEngine[a].some(isVietnameseVoice) ? 0 : 1;
      const bHasVi = voicesByEngine[b].some(isVietnameseVoice) ? 0 : 1;
      if (aHasVi !== bHasVi) return aHasVi - bHasVi;
      return a.localeCompare(b);
    });

    engineSelect.innerHTML = '';
    engineNames.forEach(engine => {
      const opt = document.createElement('option');
      opt.value = engine;
      const viCount = voicesByEngine[engine].filter(isVietnameseVoice).length;
      opt.textContent = engine + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voicesByEngine[engine].length + ' giọng)');
      engineSelect.appendChild(opt);
    });

    if (engineNames.length > 0) {
      engineSelect.value = engineNames[0];
      populateVoiceSelect(engineNames[0]);
    }
    return true;
  }

  function populateVoiceSelect(engineName) {
    const voices = voicesByEngine[engineName] || [];
    // Ưu tiên giọng tiếng Việt lên đầu danh sách
    const sorted = [...voices].sort((a, b) => {
      const aVi = isVietnameseVoice(a) ? 0 : 1;
      const bVi = isVietnameseVoice(b) ? 0 : 1;
      if (aVi !== bVi) return aVi - bVi;
      return a.name.localeCompare(b.name);
    });

    voiceSelect.innerHTML = '';
    sorted.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI || v.name;
      const flag = isVietnameseVoice(v) ? '🇻🇳 ' : '';
      opt.textContent = flag + v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
  }

  engineSelect.addEventListener('change', async () => {
    const engineKey = engineSelect.value;
    populateVoiceSelect(engineKey);

    // Ở chế độ native, mỗi "bộ đọc" là 1 engine Android thật riêng biệt —
    // phải báo cho plugin chuyển engine đang active thì speak()/lưu file
    // mới dùng đúng giọng của bộ đọc vừa chọn (không chỉ đổi mỗi UI).
    if (ttsMode === 'native') {
      const plugin = getNativeTtsPlugin();
      if (!plugin) return;

      // QUAN TRỌNG: setEngine() và speak() dùng CHUNG 1 luồng xử lý phía
      // Kotlin (để tránh 2 engine cùng phát ra loa một lúc / xung đột thiết
      // bị đầu ra) -> nếu đang đọc dở mà không dừng trước, lệnh đổi engine
      // sẽ bị XẾP HÀNG chờ đọc xong TOÀN BỘ văn bản mới thật sự chạy, khiến
      // người dùng tưởng app bị treo/lag. Phải dừng đọc trước khi đổi.
      if (isSpeaking) {
        await stopCurrentSpeech();
        setSpeakingUI(false);
        updateProgressStatus();
      }

      engineSelect.disabled = true;
      btnSpeak.disabled = true;
      statusText.textContent = 'Đang chuyển bộ đọc...';
      try {
        await plugin.setEngine({ engineName: engineKey });
        statusText.textContent = 'Sẵn sàng';
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        showToast('Không thể chuyển sang bộ đọc này: ' + msg, true);
        statusText.textContent = 'Sẵn sàng';
      } finally {
        engineSelect.disabled = false;
        btnSpeak.disabled = false;
      }
    }
  });

  function getSelectedVoice() {
    const key = voiceSelect.value;
    // Tìm trong đúng danh sách giọng của bộ đọc đang chọn trước (tránh
    // trùng tên giữa các bộ đọc khác nhau khi ở chế độ native nhiều engine),
    // rồi mới rơi về tìm trong toàn bộ allVoices như phương án dự phòng.
    const inCurrentEngine = (voicesByEngine[engineSelect.value] || [])
      .find(v => (v.voiceURI || v.name) === key);
    if (inCurrentEngine) return inCurrentEngine;
    return allVoices.find(v => (v.voiceURI || v.name) === key) || null;
  }

  // ---------- Speak logic (hàng đợi từng câu, DÙNG CHUNG cho cả web & native) ----------
  // Nút chính (▶️/⏹) gộp Phát + Dừng làm MỘT nút duy nhất. Hàng đợi câu
  // (speechQueue/queueIndex) vẫn được giữ nội bộ dù không còn nút Tua lùi/
  // Tua tới trên UI — dùng để: (1) biết chính xác câu đang đọc dở để "Đọc
  // tiếp" đúng chỗ sau khi Dừng, (2) hiển thị tiến độ qua statusText.
  function hasUnfinishedQueue() {
    return speechQueue.length > 0 && queueIndex > 0 && queueIndex < speechQueue.length;
  }

  function setSpeakingUI(speaking) {
    isSpeaking = speaking;
    btnSpeak.classList.toggle('speaking', speaking);
    btnSpeakIcon.textContent = speaking ? '⏹' : '▶️';
    btnSpeakLabel.textContent = speaking ? 'DỪNG ĐỌC' : (hasUnfinishedQueue() ? 'TIẾP TỤC ĐỌC' : 'ĐỌC VĂN BẢN');
    btnSpeak.setAttribute('aria-label', speaking ? 'Dừng đọc' : (hasUnfinishedQueue() ? 'Tiếp tục đọc văn bản' : 'Phát văn bản'));
    statusDot.classList.toggle('active', speaking);
  }

  function updateProgressStatus() {
    if (speechQueue.length === 0) {
      statusText.textContent = 'Sẵn sàng';
      return;
    }
    const shown = Math.min(queueIndex + 1, speechQueue.length);
    statusText.textContent = (isSpeaking ? 'Đang đọc đoạn ' : 'Sẵn sàng đọc đoạn ') + shown + ' / ' + speechQueue.length;
  }

  function stopKeepAlive() {
    if (keepAliveTimer) {
      clearInterval(keepAliveTimer);
      keepAliveTimer = null;
    }
  }

  // Khắc phục lỗi đã biết trên Chrome/WebView Android: speechSynthesis tự
  // "đóng băng" và ngừng phát sau khoảng 15 giây nếu không có tương tác.
  // Giải pháp: định kỳ gọi pause() rồi resume() để "đánh thức" engine.
  function startKeepAlive() {
    stopKeepAlive();
    keepAliveTimer = setInterval(() => {
      if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    }, KEEPALIVE_MS);
  }

  // Xây lại hàng đợi câu từ văn bản hiện tại — CHỈ gọi khi bắt đầu đọc mới
  // hoàn toàn (không gọi lúc tiếp tục/tua, để không mất vị trí đang dừng dở).
  function buildQueue(text) {
    speechQueue = splitIntoChunks(text);
    queueIndex = 0;
    lastQueueText = text;
  }

  function resetQueueState() {
    speechQueue = [];
    queueIndex = 0;
    lastQueueText = '';
    stopKeepAlive();
  }

  // ---------- Nhánh Web Speech API ----------
  function speakNextChunk(sessionId) {
    // Nếu phiên đọc này đã bị hủy bởi một lệnh mới hơn (Dừng/Tua) thì thôi
    if (sessionId !== currentSessionId) return;

    if (queueIndex >= speechQueue.length) {
      stopKeepAlive();
      setSpeakingUI(false);
      statusText.textContent = 'Đã đọc xong';
      return;
    }

    const chunk = speechQueue[queueIndex];
    const utterance = new SpeechSynthesisUtterance(chunk);
    const voice = getSelectedVoice();
    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = 'vi-VN';
    }
    utterance.rate = parseFloat(rateSelect.value);
    utterance.pitch = parseFloat(pitchSelect.value);

    utterance.onstart = () => {
      if (sessionId !== currentSessionId) return;
      setSpeakingUI(true);
      updateProgressStatus();
    };

    utterance.onend = () => {
      if (sessionId !== currentSessionId) return;
      queueIndex += 1;
      speakNextChunk(sessionId);
    };

    utterance.onerror = (e) => {
      if (sessionId !== currentSessionId) return;
      if (e.error === 'canceled' || e.error === 'interrupted') return;
      stopKeepAlive();
      setSpeakingUI(false);
      showToast('Đã xảy ra lỗi khi đọc văn bản: ' + e.error, true);
    };

    window.speechSynthesis.speak(utterance);
  }

  function startSpeakingWeb(text) {
    if (!synthSupported) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    window.speechSynthesis.cancel();
    currentSessionId += 1;
    const sessionId = currentSessionId;

    buildQueue(text);
    if (speechQueue.length === 0) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    startKeepAlive();
    speakNextChunk(sessionId);
    // Chuyển giao diện sang "đang đọc" NGAY, không chờ sự kiện onstart (có thể trễ vài
    // trăm ms): nếu chờ, chạm đúp trong khoảng đó sẽ khởi động lại lần nữa; còn bây giờ
    // lần chạm thứ 2 được hiểu đúng là "Dừng". onerror sẽ trả giao diện về như cũ.
    setSpeakingUI(true);
    updateProgressStatus();
  }

  // ---------- Nhánh plugin native ----------
  // QUAN TRỌNG: gửi TOÀN BỘ mảng câu còn lại cho plugin trong DUY NHẤT 1 lệnh
  // gọi (plugin.speak({chunks, startIndex, ...})), để Kotlin đọc liên tục
  // không rời vòng lặp. TUYỆT ĐỐI không gọi speak() riêng cho từng câu rồi
  // chờ JS gọi lại — cách đó tạo ra khoảng trống "round-trip" giữa 2 câu
  // (JS chờ Promise trả về rồi mới gọi câu tiếp), khiến hàng đợi âm thanh
  // của engine bị rỗng giữa chừng, audio route phải khởi động lại như câu
  // đầu -> gây mất tiếng đầu + khựng LẶP LẠI ở mọi câu (lỗi đã gặp phải).
  // Sự kiện 'speakProgress' (Kotlin bắn về mỗi khi bắt đầu câu mới) giúp JS
  // biết chính xác plugin đang đọc tới câu nào — dùng để cập nhật thanh
  // tiến độ và để "Đọc tiếp" sau khi Dừng tiếp tục đúng từ câu đang dở,
  // không cần JS tự gọi lại speak() cho từng câu.
  let nativeListenersReady = false;
  function setupNativeListeners() {
    if (nativeListenersReady) return;
    const plugin = getNativeTtsPlugin();
    if (!plugin || typeof plugin.addListener !== 'function') return;
    nativeListenersReady = true;
    plugin.addListener('speakProgress', (data) => {
      if (data && typeof data.index === 'number') {
        queueIndex = data.index;
        updateProgressStatus();
      }
    });
    // Tiến độ khi đang LƯU FILE (không phải đọc qua loa) — xem lý do thêm ở
    // handler btnSaveAudio bên dưới: cho người dùng thấy app đang chạy thật,
    // không phải bị "đơ", nhất là khi văn bản dài mất nhiều thời gian tổng hợp.
    plugin.addListener('saveProgress', (data) => {
      if (data && typeof data.done === 'number' && typeof data.total === 'number' && data.total > 0) {
        statusText.textContent = `Đang tạo file âm thanh… ${data.done}/${data.total} đoạn`;
      }
    });
    // Nhiều bộ đọc (ngoài Google) bỏ qua yêu cầu đổi tốc độ. App tự đo, và nếu bộ đọc không
    // làm đúng thì tự chỉnh tốc độ bằng phần mềm; thông báo 1 lần để người dùng biết vì sao
    // lúc này tiếng được xử lý thêm (và nếu phải bỏ cách đó thì cũng biết vì sao tốc độ không đổi).
    plugin.addListener('speedMode', (data) => {
      if (!data) return;
      if (data.fallback) {
        showToast('Không chỉnh được tốc độ bằng phần mềm trên máy này, sẽ đọc ở tốc độ gốc của bộ đọc.', true);
        return;
      }
      if (data.software) {
        const f = Number(data.factor);
        const key = isFinite(f) ? f.toFixed(2) : '';
        if (key !== lastSpeedToastKey) {
          lastSpeedToastKey = key;
          const shown = isFinite(f) ? ' (×' + f.toFixed(2).replace(/\.?0+$/, '') + ')' : '';
          showToast('Bộ đọc này không tự đổi được tốc độ nên app điều chỉnh bằng phần mềm' + shown + '.');
        }
      }
    });
  }

  async function runNativeSpeech(startIndex, warmup) {
    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      setSpeakingUI(false);
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }
    setupNativeListeners();

    currentSessionId += 1;
    const sessionId = currentSessionId;
    const voice = getSelectedVoice();

    setSpeakingUI(true);
    queueIndex = startIndex;
    updateProgressStatus();

    let result;
    try {
      // 1 LỆNH GỌI DUY NHẤT cho toàn bộ phần còn lại — xem giải thích ở trên.
      result = await plugin.speak({
        chunks: speechQueue,
        startIndex: startIndex,
        voiceName: voice ? voice.name : '',
        lang: voice ? voice.lang : 'vi-VN',
        rate: parseFloat(rateSelect.value),
        pitch: parseFloat(pitchSelect.value),
        warmup: !!warmup
      });
    } catch (err) {
      if (sessionId !== currentSessionId) return; // bị hủy do Dừng/Tua giữa chừng
      const msg = (err && err.message) ? err.message : String(err);
      showToast('Lỗi khi đọc văn bản: ' + msg, true);
      setSpeakingUI(false);
      return;
    }

    // plugin.speak() chỉ thật sự "resolve xong" khi TOÀN BỘ câu đã đọc hết
    // hoặc bị stopSpeaking() hủy giữa chừng. Nếu đã bị một lệnh mới hơn
    // (Dừng/Tua/Lưu file) vô hiệu hóa session này thì bỏ qua, phần code xử lý
    // thao tác đó đã tự cập nhật UI của riêng nó rồi.
    if (sessionId !== currentSessionId) return;
    // Đọc xong TỰ NHIÊN (không bị hủy, không lỗi): đưa queueIndex ra sau đoạn cuối, giống
    // nhánh web. Bản cũ để nguyên queueIndex = đoạn cuối (do sự kiện speakProgress) nên
    // bấm Phát lại sẽ chỉ đọc lại ĐÚNG đoạn cuối thay vì đọc lại từ đầu, và nhãn nút
    // hiện nhầm "TIẾP TỤC ĐỌC". Phải đặt TRƯỚC setSpeakingUI(false) vì nhãn phụ thuộc nó.
    if (!(result && (result.failed || result.cancelled))) {
      queueIndex = speechQueue.length;
    }
    setSpeakingUI(false);

    // Xử lý theo kết quả THẬT trả về (bản cũ luôn báo "Đã đọc xong" bất kể vì
    // sao dừng lại, kể cả khi dừng do lỗi hoặc bị bộ đọc khác — ví dụ TalkBack
    // — chiếm dụng engine quá lâu).
    if (result && result.failed) {
      const msg = result.failReason === 'preempted'
        ? 'Bộ đọc đang bận phục vụ ứng dụng khác (ví dụ TalkBack) quá lâu nên đã dừng lại. Hãy thử lại, hoặc đổi sang một bộ đọc khác trong Cài đặt để tránh dùng chung bộ đọc với TalkBack.'
        : 'Bộ máy đọc gặp lỗi liên tục nên đã dừng lại. Hãy thử lại, hoặc đổi sang một bộ đọc khác trong Cài đặt.';
      showToast(msg, true);
      statusText.textContent = 'Đã dừng do lỗi';
    } else if (!result || !result.cancelled) {
      statusText.textContent = 'Đã đọc xong';
    }
    // Nếu result.cancelled === true: đây là do người dùng chủ động Dừng/Tua/
    // Lưu file — nơi gọi thao tác đó đã tự đặt statusText phù hợp rồi, không
    // ghi đè ở đây.
  }

  async function startSpeakingNative(text) {
    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    try {
      const engineStatus = await plugin.getEngineStatus();
      if (engineStatus && engineStatus.status === 'error') {
        showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
        return;
      }
    } catch (e) {
      // Plugin cũ không có getEngineStatus: bỏ qua, để speak() tự báo lỗi.
    }

    buildQueue(text);
    if (speechQueue.length === 0) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    runNativeSpeech(0, true);
  }

  // Dừng HẲN đoạn đang đọc dở (không có khái niệm "tạm dừng" riêng — bấm
  // Dừng rồi bấm lại nút Phát sẽ tự tiếp tục đúng từ câu đang dở, nhờ giữ
  // nguyên queueIndex). Dùng chung cho mọi trường hợp cần ngắt đọc giữa chừng.
  async function stopCurrentSpeech() {
    currentSessionId += 1; // vô hiệu hóa mọi callback/await đang chờ của đoạn cũ
    stopKeepAlive();
    if (ttsMode === 'native') {
      const plugin = getNativeTtsPlugin();
      if (plugin) {
        try { await plugin.stopSpeaking(); } catch (e) { /* không quan trọng, bỏ qua */ }
      }
    } else if (ttsMode === 'web') {
      window.speechSynthesis.cancel();
    }
  }

  btnSpeak.addEventListener('click', async () => {
    if (ttsMode !== 'native' && ttsMode !== 'web') {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }

    // Đang trong bước khởi động (hỏi trạng thái engine...): bỏ qua lần chạm thừa để
    // không gửi 2 lệnh đọc (sẽ đọc trùng 2 lần). Sau khi giao diện đã chuyển sang ⏹,
    // lần chạm kế tiếp được hiểu là "Dừng" như bình thường.
    if (startInFlight) return;

    if (isSpeaking) {
      // Đang đọc -> bấm để DỪNG HẲN. Vẫn giữ nguyên queueIndex để bấm lại
      // nút này sẽ đọc tiếp đúng từ câu đang dừng, không đọc lại từ đầu.
      await stopCurrentSpeech();
      setSpeakingUI(false);
      statusText.textContent = 'Đã dừng (đoạn ' + (queueIndex + 1) + ' / ' + speechQueue.length + ')';
      return;
    }

    startInFlight = true;
    try {
      const text = textInput.value;
      // Hàng đợi rỗng, đã đọc hết toàn bộ, hoặc văn bản đã bị sửa từ lúc dừng
      // -> coi như đọc mới hoàn toàn từ đầu.
      if (speechQueue.length === 0 || queueIndex >= speechQueue.length || text !== lastQueueText) {
        if (ttsMode === 'native') {
          await startSpeakingNative(text);
        } else {
          startSpeakingWeb(text);
        }
        return;
      }

      // Còn dang dở (đã dừng giữa chừng, văn bản không đổi) -> đọc tiếp đúng
      // từ câu đang dừng, KHÔNG đọc lại từ đầu.
      if (ttsMode === 'native') {
        runNativeSpeech(queueIndex, true);
      } else {
        currentSessionId += 1;
        const sessionId = currentSessionId;
        startKeepAlive();
        speakNextChunk(sessionId);
        setSpeakingUI(true);
        updateProgressStatus();
      }
    } finally {
      startInFlight = false;
    }
  });


  // ---------- Đổi Tốc độ / Cao độ / Giọng đọc KHI ĐANG ĐỌC ----------
  // LỖI ĐÃ SỬA: 3 ô chọn này trước đây KHÔNG có listener nào. Nhánh native chỉ gửi
  // rate/pitch/voice ĐÚNG 1 LẦN trong plugin.speak() rồi engine đọc hết cả văn
  // bản với giá trị cũ; nhánh web thì chỉ đổi từ đoạn kế tiếp. Hệ quả: chỉnh tốc
  // độ giữa chừng thấy "không có tác dụng gì" cho tới khi tự bấm Dừng rồi Phát
  // lại. Nay: nếu ĐANG đọc thì dừng phiên hiện tại và đọc tiếp NGAY từ đoạn đang
  // dở với thiết lập mới (không đọc lại từ đầu). Nếu đang dừng thì lần Phát/Tiếp
  // tục kế tiếp tự lấy giá trị mới như trước.
  let settingsRestartTimer = null;
  let settingsRestartRunning = false;
  let settingsRestartAgain = false;

  function scheduleRestartForNewSettings() {
    // Gộp nhiều lần đổi liên tiếp thành 1 lần khởi động lại
    clearTimeout(settingsRestartTimer);
    settingsRestartTimer = setTimeout(() => {
      restartSpeechWithNewSettings().catch(err => console.error(err));
    }, 250);
  }

  async function restartSpeechWithNewSettings() {
    if (!isSpeaking) return;
    if (settingsRestartRunning) { settingsRestartAgain = true; return; }
    settingsRestartRunning = true;
    try {
      do {
        settingsRestartAgain = false;
        if (!isSpeaking) break;

        // stopCurrentSpeech() tăng currentSessionId NGAY (đồng bộ) trước khi await,
        // nên ghi nhận số phiên ngay sau lệnh gọi: nếu trong lúc chờ dừng mà người
        // dùng bấm Dừng / xoá văn bản (số phiên đổi) thì KHÔNG được tự đọc lại.
        const stopping = stopCurrentSpeech();
        const sessionAfterStop = currentSessionId;
        await stopping;
        if (currentSessionId !== sessionAfterStop || !isSpeaking) break;

        showToast('Đã áp dụng thiết lập mới, đọc tiếp từ đoạn hiện tại.');
        if (ttsMode === 'native') {
          runNativeSpeech(queueIndex, true);
        } else {
          currentSessionId += 1;
          startKeepAlive();
          speakNextChunk(currentSessionId);
        }
      } while (settingsRestartAgain);
    } finally {
      settingsRestartRunning = false;
    }
  }

  rateSelect.addEventListener('change', scheduleRestartForNewSettings);
  pitchSelect.addEventListener('change', scheduleRestartForNewSettings);
  voiceSelect.addEventListener('change', scheduleRestartForNewSettings);

  // Nếu người dùng chuyển ứng dụng / tắt màn hình, khi quay lại kiểm tra và
  // đồng bộ lại UI cho khớp trạng thái thực tế của engine (tránh kẹt UI).
  document.addEventListener('visibilitychange', () => {
    if (ttsMode !== 'web') return;
    if (document.visibilityState === 'visible') {
      if (!window.speechSynthesis.speaking && isSpeaking) {
        stopKeepAlive();
        setSpeakingUI(false);
      }
    }
  });

  // ---------- Lưu âm thanh ra file (chỉ hoạt động trong bản APK native/Capacitor) ----------
  function getNativeTtsPlugin() {
    // Capacitor tự động bơm window.Capacitor khi chạy trong app APK đã build từ project này.
    // Khi mở bằng trình duyệt thường (Chrome/testing), window.Capacitor sẽ không tồn tại.
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TtsFileSaver) {
      return window.Capacitor.Plugins.TtsFileSaver;
    }
    return null;
  }

  function setSaveButtonState(state) {
    // state: 'idle' | 'processing' | 'disabled'
    btnSaveAudio.classList.toggle('processing', state === 'processing');
    btnSaveAudio.disabled = state === 'processing';
    // Trong lúc đang tạo file, khoá nút Phát: lệnh đọc sẽ phải xếp hàng SAU việc
    // tạo file trên cùng 1 luồng engine (có thể vài phút) -> giao diện báo "đang
    // đọc" nhưng không có tiếng. Mở lại khi xong (trừ khi máy không có bộ đọc nào).
    btnSpeak.disabled = (state === 'processing') || ttsMode === 'none';
    // Đổi bộ đọc trong lúc xuất file chỉ bị xếp hàng chờ xuất xong (cùng 1 luồng engine)
    // và làm giao diện kẹt ở "Đang chuyển bộ đọc..." -> khoá ô chọn bộ đọc tới lúc xong.
    engineSelect.disabled = (state === 'processing');
    if (state === 'processing') {
      btnSaveAudio.textContent = '⏳ Đang tạo file âm thanh...';
    } else {
      // Trả về ĐÚNG nhãn gốc: bản cũ đổi thành "(file WAV)" dài hơn làm thanh trên
      // chật và thu hẹp tiêu đề trên màn hình nhỏ.
      btnSaveAudio.textContent = SAVE_LABEL;
    }
  }

  btnSaveAudio.addEventListener('click', async () => {
    if (saveInFlight) return; // chặn chạm đúp: chỉ 1 lần xuất file tại 1 thời điểm
    const text = textInput.value;
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi lưu âm thanh.', true);
      return;
    }

    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Tính năng lưu file chỉ hoạt động trong bản APK đã đóng gói (không dùng được khi mở bằng trình duyệt thường).', true);
      return;
    }

    // Khoá nút NGAY (trước mọi bước await bên dưới). Bản cũ chỉ khoá sau khi hỏi xong
    // trạng thái engine nên chạm 2 lần liên tiếp sẽ xuất 2 file trùng nhau.
    saveInFlight = true;
    setSaveButtonState('processing');
    try {
      // QUAN TRỌNG (khắc phục "lưu âm thanh quá lâu"): app chỉ dùng 1 bộ máy
      // TTS duy nhất cho cả việc đọc qua loa lẫn xuất file, và bộ máy đó chỉ
      // làm được 1 việc tại 1 thời điểm. Nếu đang đọc dở mà không dừng trước,
      // việc lưu file phải NẰM CHỜ đọc xong toàn bộ văn bản rồi mới bắt đầu —
      // với văn bản dài, cảm giác y hệt "bấm Lưu mà không thấy phản hồi gì".
      // Phía Kotlin cũng tự ép dừng phòng hờ, nhưng dừng từ đây giúp giao diện
      // cập nhật NGAY LẬP TỨC thay vì đợi tới lúc đó mới biết.
      if (isSpeaking) {
        await stopCurrentSpeech();
        setSpeakingUI(false);
        updateProgressStatus();
      }

      try {
        const engineStatus = await plugin.getEngineStatus();
        if (engineStatus && engineStatus.status === 'error') {
          showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
          return;
        }
        if (engineStatus && engineStatus.status === 'loading') {
          showToast('Bộ máy Text-to-Speech đang khởi động, vui lòng thử lại sau vài giây.', true);
          return;
        }
      } catch (e) {
        // Plugin cũ không có getEngineStatus: bỏ qua bước kiểm tra trước, để
        // synthesizeToFile() tự báo lỗi nếu engine chưa sẵn sàng.
      }

      // Đăng ký listener TRƯỚC khi gọi synthesizeToFile(), không sau — nếu đăng
      // ký sau, sự kiện saveProgress đầu tiên (thường bắn ra rất sớm) có thể lỡ mất.
      setupNativeListeners();

      const voice = getSelectedVoice();
      statusText.textContent = 'Đang tạo file âm thanh…';
      const result = await plugin.synthesizeToFile({
        text: text,
        voiceName: voice ? voice.name : '',
        lang: voice ? voice.lang : 'vi-VN',
        rate: parseFloat(rateSelect.value),
        pitch: parseFloat(pitchSelect.value)
      });

      statusText.textContent = 'Sẵn sàng';

      if (result && result.uri) {
        showToast('Đã lưu file âm thanh: ' + (result.fileName || 'audio.wav'));
        // Mở hộp thoại chia sẻ / lưu ngay sau khi tạo xong (tùy chọn, không bắt buộc)
        try {
          await plugin.shareFile({ uri: result.uri, fileName: result.fileName || 'audio.wav' });
        } catch (shareErr) {
          // Người dùng hủy chia sẻ không phải lỗi nghiêm trọng, bỏ qua
        }
      } else {
        showToast('Không nhận được đường dẫn file sau khi tạo âm thanh.', true);
      }
    } catch (err) {
      statusText.textContent = 'Sẵn sàng';
      const msg = (err && err.message) ? err.message : String(err);
      showToast('Lỗi khi tạo file âm thanh: ' + msg, true);
    } finally {
      // Luôn mở khoá, kể cả khi thoát sớm bằng return ở các nhánh báo lỗi phía trên.
      saveInFlight = false;
      setSaveButtonState('idle');
    }
  });


  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Chờ engine native báo "ready" hoặc "error", thăm dò tối đa ~6 giây.
  // Tránh việc báo lỗi ngay lập tức trong khi engine Android vẫn đang khởi
  // tạo bất đồng bộ (thường mất 1-2 giây sau khi app mở).
  async function waitForNativeEngineStatus(plugin, maxWaitMs) {
    const start = Date.now();
    let last = null;
    while (Date.now() - start < maxWaitMs) {
      try {
        last = await plugin.getEngineStatus();
        if (last && (last.status === 'ready' || last.status === 'error')) {
          return last;
        }
      } catch (e) {
        // Nếu plugin còn quá cũ / không có getEngineStatus, coi như không xác
        // định được trạng thái và thử thẳng getVoices() bên dưới.
        return null;
      }
      await delay(400);
    }
    return last;
  }

  async function tryNativeFallback() {
    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      btnSpeak.disabled = true;
      statusText.textContent = 'Không hỗ trợ đọc giọng nói';
      ttsMode = 'none';
      return;
    }

    // Khoá nút Phát trong lúc liệt kê bộ đọc/giọng (có thể vài giây): chạm vào lúc này
    // sẽ đi nhầm sang nhánh Web Speech (ttsMode vẫn là 'web', chưa có giọng) -> im lặng.
    btnSpeak.disabled = true;
    statusText.textContent = 'Đang khởi động bộ đọc...';

    try {
      const engineStatus = await waitForNativeEngineStatus(plugin, 6000);
      if (engineStatus && engineStatus.status === 'error') {
        showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
        btnSpeak.disabled = true;
        statusText.textContent = 'Không có bộ đọc khả dụng';
        ttsMode = 'none';
        return;
      }
    } catch (e) {
      // Không xác định được trạng thái engine, vẫn thử getVoices() bên dưới
      // để tương thích ngược với plugin cũ hơn.
    }

    // Lấy TOÀN BỘ bộ đọc (engine) cài trên máy kèm TOÀN BỘ giọng đọc của
    // từng bộ đọc — không chỉ mỗi engine mặc định của hệ thống.
    try {
      const result = await plugin.getEnginesWithVoices();
      const engines = (result && result.engines) || [];
      // Chỉ giữ những bộ đọc thực sự có ít nhất 1 giọng đọc dùng được
      // (một số engine cài trên máy nhưng chưa tải gói giọng nào).
      const usable = engines.filter(e => Array.isArray(e.voices) && e.voices.length > 0);

      if (usable.length === 0) {
        showToast('Không tìm thấy giọng đọc nào trên máy. Vào Cài đặt > Ngôn ngữ > Chuyển văn bản thành giọng nói để cài giọng.', true);
        btnSpeak.disabled = true;
        statusText.textContent = 'Không có giọng đọc';
        ttsMode = 'none';
        return;
      }

      ttsMode = 'native';
      voicesByEngine = {};
      nativeEngineLabels = {};
      usable.forEach(e => {
        voicesByEngine[e.name] = e.voices;
        nativeEngineLabels[e.name] = e.label || e.name;
      });
      allVoices = usable.reduce((acc, e) => acc.concat(e.voices), []);

      // Ưu tiên bộ đọc có giọng tiếng Việt lên đầu, giống hệt cách sắp xếp
      // bên nhánh Web Speech API để trải nghiệm nhất quán giữa 2 chế độ.
      const engineKeys = Object.keys(voicesByEngine).sort((a, b) => {
        const aHasVi = voicesByEngine[a].some(isVietnameseVoice) ? 0 : 1;
        const bHasVi = voicesByEngine[b].some(isVietnameseVoice) ? 0 : 1;
        if (aHasVi !== bHasVi) return aHasVi - bHasVi;
        return (nativeEngineLabels[a] || a).localeCompare(nativeEngineLabels[b] || b);
      });

      engineSelect.innerHTML = '';
      engineKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        const voices = voicesByEngine[key];
        const viCount = voices.filter(isVietnameseVoice).length;
        const label = nativeEngineLabels[key] || key;
        opt.textContent = label + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voices.length + ' giọng)');
        engineSelect.appendChild(opt);
      });

      const firstEngineKey = engineKeys[0];
      engineSelect.value = firstEngineKey;
      populateVoiceSelect(firstEngineKey);

      // Nếu bộ đọc tốt nhất (ưu tiên tiếng Việt) không trùng engine mặc định
      // hệ thống đang dùng, chuyển plugin sang đúng engine đó ngay từ đầu.
      if (firstEngineKey && firstEngineKey !== (result.activeEngine || '')) {
        try {
          await plugin.setEngine({ engineName: firstEngineKey });
        } catch (e) {
          // Không chuyển được thì vẫn dùng engine mặc định của hệ thống —
          // không chặn người dùng, chỉ là danh sách giọng hiển thị có thể
          // chưa khớp 100% với giọng thực sự phát ra cho tới khi họ tự đổi
          // bộ đọc trong dropdown.
        }
      }

      btnSpeak.disabled = false;
      statusText.textContent = 'Sẵn sàng';
    } catch (e) {
      // Tương thích ngược: nếu APK được build từ bản plugin cũ hơn (chưa có
      // getEnginesWithVoices), rơi về getVoices() chỉ lấy giọng của engine
      // mặc định — còn hơn là không đọc được gì.
      try {
        const result = await plugin.getVoices();
        const voices = (result && result.voices) || [];
        if (voices.length === 0) {
          showToast('Không tìm thấy giọng đọc nào trên máy. Vào Cài đặt > Ngôn ngữ > Chuyển văn bản thành giọng nói để cài giọng.', true);
          btnSpeak.disabled = true;
          statusText.textContent = 'Không có giọng đọc';
          ttsMode = 'none';
          return;
        }
        ttsMode = 'native';
        allVoices = voices;
        voicesByEngine = { 'Bộ đọc hệ thống Android': voices };
        nativeEngineLabels = { 'Bộ đọc hệ thống Android': 'Bộ đọc hệ thống Android' };
        engineSelect.innerHTML = '';
        const opt = document.createElement('option');
        opt.value = 'Bộ đọc hệ thống Android';
        const viCount = voices.filter(isVietnameseVoice).length;
        opt.textContent = 'Bộ đọc hệ thống Android' + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voices.length + ' giọng)');
        engineSelect.appendChild(opt);
        populateVoiceSelect('Bộ đọc hệ thống Android');
        btnSpeak.disabled = false;
        statusText.textContent = 'Sẵn sàng';
      } catch (e2) {
        const msg = (e2 && e2.message) ? e2.message : String(e2);
        showToast('Không lấy được danh sách giọng đọc: ' + msg, true);
        btnSpeak.disabled = true;
        statusText.textContent = 'Lỗi bộ đọc';
        ttsMode = 'none';
      }
    }
  }

  // Chỉ chạy đúng 1 lần: nếu script được nạp khi readyState đã là 'interactive'
  // thì cả nhánh kiểm tra readyState lẫn sự kiện DOMContentLoaded bên dưới đều
  // gọi init() -> khởi động engine/liệt kê giọng đọc 2 lần (chậm và trùng lặp).
  let initialized = false;
  function init() {
    if (initialized) return;
    initialized = true;
    try {
      updateCharCount();

      if (!synthSupported) {
        tryNativeFallback();
        return;
      }

      ttsMode = 'web';
      if (!loadVoices()) {
        // Một số trình duyệt Android cần chờ sự kiện voiceschanged
        window.speechSynthesis.onvoiceschanged = () => {
          try { loadVoices(); } catch (e) { console.error(e); }
        };
        // fallback: thử lại sau 500ms phòng khi sự kiện không bắn
        setTimeout(() => {
          try { if (allVoices.length === 0) loadVoices(); } catch (e) { console.error(e); }
        }, 500);
        // Nếu sau 2 giây vẫn không có giọng nào -> WebView không hỗ trợ đầy đủ,
        // chuyển sang dùng plugin native để đảm bảo app vẫn đọc được
        setTimeout(() => {
          if (allVoices.length === 0) {
            tryNativeFallback();
          }
        }, 2000);
      }
    } catch (e) {
      console.error('Lỗi khi khởi động ứng dụng:', e);
      showToast('Không thể khởi động bộ đọc giọng nói. Vui lòng khởi động lại ứng dụng.', true);
      statusText.textContent = 'Lỗi khởi động';
      // Thử phương án dự phòng cuối cùng: plugin native, để app vẫn có cơ hội hoạt động.
      tryNativeFallback();
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    try { init(); } catch (e) { console.error(e); }
  });
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    try { init(); } catch (e) { console.error(e); }
  }
})();
</script>
</body>
</html>
